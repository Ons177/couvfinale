<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calendrier des Réservations</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            background-color: #f5f5f5;
        }

        #calendar-container {
            transform: scale(0.8); /* Réduction visuelle */
            transform-origin: top center;
            width: 100%;
            max-width: 900px; /* Limite max de la largeur */
        }

        #calendar {
            max-width: 100%;
        }
    </style>
</head>
<body>
<div id="calendar-container">
    <div id='calendar'></div>
</div>

<script>
    function loadReservations(eventsJson) {
        const events = JSON.parse(eventsJson);
        const calendarEl = document.getElementById('calendar');

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            events: events,
            dateClick: function(info) {
                window.javaApp.ouvrirReservationParDate(info.dateStr);
            }

        });

        calendar.render();
    }
</script>

</body>
</html>

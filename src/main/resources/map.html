<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Localisation</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* léger gris clair pour les bords */
        }

        #infoBox {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 280px;
            font-size: 14px;
            z-index: 1000;
        }

        #infoBox h3 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #333;
        }

        .leaflet-control-zoom {
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .leaflet-control-attribution {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.9);
            padding: 3px 6px;
            border-radius: 6px;
        }

        .leaflet-container {
            background-color: #eaeaea;
        }

        .leaflet-marker-icon {
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="infoBox">
    <h3>Adresse</h3>
    <p id="adresse">Cliquez sur la carte</p>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([36.8065, 10.1815], 12);

    // Fond OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);

    let marker = null;

    // Fonction pour obtenir l'adresse inverse
    function reverseGeocode(lat, lng) {
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`;
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data && data.display_name) {
                    document.getElementById("adresse").textContent = data.display_name;
                    window.javaApp?.setAdresse(data.display_name); // 🔁 Vers JavaFX
                }
            })
            .catch(err => console.error("Erreur géocodage inverse :", err));
    }

    // Sur clic de la carte
    map.on('click', function (e) {
        if (marker) {
            marker.setLatLng(e.latlng);
        } else {
            marker = L.marker(e.latlng).addTo(map);
        }

        reverseGeocode(e.latlng.lat, e.latlng.lng);
        window.javaApp?.onLocationSelected(e.latlng.lat, e.latlng.lng); // 🔁 JavaFX
    });

    // Ajuster la taille de la carte après le chargement
    window.addEventListener("load", () => {
        setTimeout(() => {
            map.invalidateSize();
        }, 100);
    });
</script>

</body>
</html>
